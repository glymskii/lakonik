# Корпоративный контур Lakonik (ADV Kazakhstan): всё приложение целиком на сервере заказчика.
# Запуск:  docker compose --env-file .env up -d
# Обновление: docker compose pull && docker compose up -d
#
# Наружу открыт только Caddy (80/443). Postgres, MinIO и сервисы приложения доступны лишь внутри сети compose.
name: lakonik

x-app: &app
  image: ${LAKONIK_IMAGE:-ghcr.io/glymskii/lakonik-server:latest}
  restart: unless-stopped
  env_file: .env
  environment:
    NODE_ENV: production
    DATABASE_URL: postgres://lakonik:${POSTGRES_PASSWORD}@postgres:5432/lakonik
    S3_ENDPOINT: http://minio:9000
    S3_PUBLIC_ENDPOINT: http://minio:9000
    S3_REGION: us-east-1
    S3_BUCKET: audio-temp
    S3_URL_STYLE: path
    S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
    S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    STT_UPLOAD_MODE: file    # аудио уходит в ElevenLabs байтами: хранилище внутреннее, ссылок наружу нет
  depends_on:
    postgres: { condition: service_healthy }
    minio: { condition: service_healthy }

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lakonik
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: lakonik
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lakonik -d lakonik"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./data/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Создаёт bucket для временного аудио и завершается
  createbucket:
    image: quay.io/minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
             mc mb --ignore-existing local/audio-temp &&
             mc ilm rule add --expire-days 2 local/audio-temp || true"

  api:
    <<: *app
    command: sh -c "node dist/db/migrate.js && node dist/db/seed.js && node dist/api/index.js"
    expose: ["3000"]

  worker:
    <<: *app
    command: node dist/worker/index.js

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      LAKONIK_DOMAIN: ${LAKONIK_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
      - ./data/caddy-config:/config
    depends_on: [api]
