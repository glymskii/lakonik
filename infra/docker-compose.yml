# Локальное окружение разработки: Postgres + MinIO (эмуляция Railway Bucket / S3)
# Запуск: docker compose -f infra/docker-compose.yml up -d
# Bucket audio-temp создаётся командой: pnpm --filter @lakonik/server dev:bucket
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: adv
      POSTGRES_PASSWORD: adv
      POSTGRES_DB: adv
    ports:
      - "5439:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adv -d adv"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./data/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
