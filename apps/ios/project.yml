name: Lakonik
options:
  bundleIdPrefix: kz.adv
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  developmentLanguage: ru
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    DEVELOPMENT_TEAM: JWL983DY46
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SENTRY_DSN: "" # DSN sentry-cocoa; пусто — SDK не запускается
  configs:
    Debug:
      API_BASE_URL: "http://localhost:3000"
    Release:
      API_BASE_URL: "https://api.lakonik.app"
packages:
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    from: 8.40.0
targets:
  Lakonik:
    type: application
    platform: iOS
    sources:
      - path: Lakonik
    dependencies:
      - package: Sentry
        product: Sentry
      - target: LakonikWidgets
        embed: true
        codeSign: true
      - target: LakonikBroadcast
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kz.adv.meetings
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Lakonik/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Lakonik/Resources/Lakonik.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    info:
      path: Lakonik/Resources/Info.plist
      properties:
        CFBundleDisplayName: Lakonik
        CFBundleName: Lakonik
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: ru
        CFBundleLocalizations: [ru]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        UIBackgroundModes: [audio, fetch, processing, remote-notification]
        NSMicrophoneUsageDescription: "Микрофон нужен для записи встреч. Аудио обрабатывается на сервере и удаляется сразу после расшифровки."
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: false
        API_BASE_URL: $(API_BASE_URL)
        SENTRY_DSN: $(SENTRY_DSN)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        BGTaskSchedulerPermittedIdentifiers: [kz.adv.meetings.upload-retry]
        ITSAppUsesNonExemptEncryption: false
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Audio
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.audio, public.mpeg-4-audio, public.mp3, com.apple.m4a-audio, public.movie]
  LakonikWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: LakonikWidgets
      - path: Lakonik/Recording/RecordingActivityAttributes.swift
      - path: Lakonik/Recording/RecordingIntents.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kz.adv.meetings.widgets
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: LakonikWidgets/Info.plist
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WIDGET_EXTENSION"
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: LakonikWidgets/Info.plist
      properties:
        CFBundleDisplayName: Lakonik
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: ru
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  LakonikBroadcast:
    type: app-extension
    platform: iOS
    sources:
      - path: LakonikBroadcast
      - path: Lakonik/Recording/BroadcastSession.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kz.adv.meetings.broadcast
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: LakonikBroadcast/Info.plist
        CODE_SIGN_ENTITLEMENTS: LakonikBroadcast/LakonikBroadcast.entitlements
        SKIP_INSTALL: YES
    info:
      path: LakonikBroadcast/Info.plist
      properties:
        CFBundleDisplayName: Запись встречи
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: ru
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          # Валидатор App Store Connect ищет ключ прямо под NSExtension (в NSExtensionAttributes, как в шаблоне Xcode, он его «не видит»)
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
          NSExtensionAttributes:
            RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
schemes:
  Lakonik:
    build:
      targets:
        Lakonik: all
    run:
      config: Debug
    archive:
      config: Release
